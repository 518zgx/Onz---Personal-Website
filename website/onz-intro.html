<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONZ | One New Zone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="prefetch" href="onz-main.html">
    <style>
        :root {
            --onz-black: #0a0a0f;
            --onz-dark: #1a1a2e;
            --onz-cyan: #00f5ff;
            --onz-orange: #ff4500;
            --onz-purple: #9d00ff;
            --onz-green: #00ff88;
            --onz-silver: #c0c0c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--onz-black);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        #intro-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .onz-container {
            position: relative;
            margin-bottom: 60px;
        }

        .onz-text {
            font-family: 'Orbitron', monospace;
            font-size: clamp(100px, 25vw, 300px);
            font-weight: 900;
            letter-spacing: -10px;
            position: relative;
            color: var(--onz-black);
            text-shadow: none;
        }

        .onz-text span {
            display: inline-block;
            position: relative;
        }

        .onz-text span::before,
        .onz-text span::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch-layer-1 {
            animation: glitch1 0.3s infinite linear alternate-reverse;
            color: var(--onz-cyan);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }

        .glitch-layer-2 {
            animation: glitch2 0.3s infinite linear alternate-reverse;
            color: var(--onz-orange);
            clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }

        @keyframes glitch1 {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 3px); }
            40% { transform: translate(-5px, -3px); }
            60% { transform: translate(5px, 3px); }
            80% { transform: translate(5px, -3px); }
            100% { transform: translate(0); }
        }

        @keyframes glitch2 {
            0% { transform: translate(0); }
            20% { transform: translate(5px, -3px); }
            40% { transform: translate(5px, 3px); }
            60% { transform: translate(-5px, -3px); }
            80% { transform: translate(-5px, 3px); }
            100% { transform: translate(0); }
        }

        .onz-underline {
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, var(--onz-cyan), var(--onz-purple), var(--onz-orange), var(--onz-green), var(--onz-cyan));
            background-size: 200% 100%;
            animation: gradientMove 2s linear infinite;
            border-radius: 4px;
            margin-top: 10px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .tagline {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(14px, 3vw, 24px);
            font-weight: 300;
            letter-spacing: 15px;
            text-transform: uppercase;
            color: var(--onz-silver);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 1s ease forwards;
            animation-delay: 1s;
        }

        .enter-btn {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .enter-btn.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        .enter-btn button {
            font-family: 'Orbitron', monospace;
            font-size: clamp(16px, 2.5vw, 24px);
            font-weight: 600;
            letter-spacing: 8px;
            text-transform: uppercase;
            padding: 20px 60px;
            background: transparent;
            color: var(--onz-cyan);
            border: 3px solid var(--onz-cyan);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .enter-btn button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 245, 255, 0.4), transparent);
            transition: left 0.5s ease;
        }

        .enter-btn button:hover::before {
            left: 100%;
        }

        .enter-btn button:hover {
            background: rgba(0, 245, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.5), inset 0 0 30px rgba(0, 245, 255, 0.1);
            transform: scale(1.05);
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 245, 255, 0.02) 50%,
                transparent 100%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1000;
            animation: scanlineMove 8s linear infinite;
        }

        @keyframes scanlineMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .corner-decor {
            position: fixed;
            width: 100px;
            height: 100px;
            border: 3px solid rgba(0, 245, 255, 0.2);
            pointer-events: none;
            z-index: 5;
        }

        .corner-decor.top-left {
            top: 30px;
            left: 30px;
            border-right: none;
            border-bottom: none;
        }

        .corner-decor.top-right {
            top: 30px;
            right: 30px;
            border-left: none;
            border-bottom: none;
        }

        .corner-decor.bottom-left {
            bottom: 30px;
            left: 30px;
            border-right: none;
            border-top: none;
        }

        .corner-decor.bottom-right {
            bottom: 30px;
            right: 30px;
            border-left: none;
            border-top: none;
        }

        .progress-bar {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            z-index: 20;
        }

        .progress-bar.hidden {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .progress-bar .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--onz-cyan), var(--onz-purple));
            width: 0%;
            transition: width 0.1s linear;
        }

        .loading-text {
            position: fixed;
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Grotesk', monospace;
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--onz-silver);
            z-index: 20;
        }

        .loading-text.hidden {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* 过渡动画层 */
        .transition-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            background: linear-gradient(
                135deg,
                var(--onz-black) 0%,
                var(--onz-cyan) 50%,
                var(--onz-purple) 100%
            );
            transition: opacity 0.6s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .transition-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .transition-overlay .transition-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', monospace;
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            color: white;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.8);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .transition-overlay.active .transition-text {
            opacity: 1;
            animation: pulseText 0.5s ease-in-out infinite alternate;
        }

        @keyframes pulseText {
            from {
                text-shadow: 0 0 30px rgba(0, 245, 255, 0.8);
            }
            to {
                text-shadow: 0 0 60px rgba(157, 0, 255, 0.9);
            }
        }

        .transition-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .transition-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00f5ff;
            border-radius: 50%;
            animation: floatParticle 2s ease-in-out infinite;
        }

        @keyframes floatParticle {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-20px) scale(1.2);
                opacity: 1;
            }
        }

        .scanline-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 0%,
                rgba(0, 245, 255, 0.1) 50%,
                transparent 100%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9998;
            animation: scanlineMove 8s linear infinite;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .scanline-effect.active {
            opacity: 1;
        }

        @keyframes scanlineMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        @media (max-width: 768px) {
            .onz-text {
                font-size: clamp(80px, 20vw, 200px);
                letter-spacing: -5px;
            }

            .onz-container {
                margin-bottom: 40px;
            }

            .onz-underline {
                height: 6px;
                margin-top: 8px;
            }

            .tagline {
                letter-spacing: 8px;
            }

            .enter-btn button {
                padding: 16px 40px;
                letter-spacing: 5px;
            }

            .enter-btn {
                bottom: 12%;
            }

            .corner-decor {
                width: 70px;
                height: 70px;
            }

            .corner-decor.top-left,
            .corner-decor.top-right {
                top: 20px;
            }

            .corner-decor.top-left,
            .corner-decor.bottom-left {
                left: 20px;
            }

            .corner-decor.top-right,
            .corner-decor.bottom-right {
                right: 20px;
            }

            .corner-decor.bottom-left,
            .corner-decor.bottom-right {
                bottom: 20px;
            }

            .progress-bar {
                width: 160px;
                bottom: 40px;
            }

            .loading-text {
                bottom: 52px;
                font-size: 11px;
                letter-spacing: 3px;
            }
        }

        @media (max-width: 480px) {
            .onz-text {
                font-size: clamp(56px, 18vw, 120px);
                letter-spacing: -3px;
            }

            .onz-container {
                margin-bottom: 28px;
            }

            .onz-underline {
                height: 4px;
                margin-top: 6px;
                border-radius: 2px;
            }

            .tagline {
                letter-spacing: 4px;
                font-size: clamp(11px, 2.5vw, 16px);
            }

            .enter-btn button {
                padding: 12px 24px;
                letter-spacing: 3px;
                font-size: clamp(13px, 3vw, 18px);
                border-width: 2px;
            }

            .enter-btn {
                bottom: 10%;
            }

            .corner-decor {
                width: 45px;
                height: 45px;
                border-width: 2px;
            }

            .corner-decor.top-left,
            .corner-decor.top-right {
                top: 12px;
            }

            .corner-decor.top-left,
            .corner-decor.bottom-left {
                left: 12px;
            }

            .corner-decor.top-right,
            .corner-decor.bottom-right {
                right: 12px;
            }

            .corner-decor.bottom-left,
            .corner-decor.bottom-right {
                bottom: 12px;
            }

            .progress-bar {
                width: 120px;
                bottom: 30px;
            }

            .loading-text {
                bottom: 40px;
                font-size: 10px;
                letter-spacing: 2px;
            }

            .transition-overlay .transition-text {
                font-size: clamp(1.5rem, 8vw, 3rem);
            }

            .enter-btn button:hover {
                box-shadow: 0 0 20px rgba(0, 245, 255, 0.4), inset 0 0 20px rgba(0, 245, 255, 0.1);
            }
        }

        @media (min-width: 1400px) {
            .onz-text {
                font-size: clamp(100px, 25vw, 300px);
            }

            .onz-container {
                margin-bottom: 70px;
            }

            .intro-overlay {
                max-width: 1400px;
                margin: 0 auto;
                left: 0;
                right: 0;
            }

            .enter-btn button {
                padding: 22px 70px;
            }

            .corner-decor {
                width: 120px;
                height: 120px;
            }

            .corner-decor.top-left,
            .corner-decor.top-right {
                top: 40px;
            }

            .corner-decor.top-left,
            .corner-decor.bottom-left {
                left: 40px;
            }

            .corner-decor.top-right,
            .corner-decor.bottom-right {
                right: 40px;
            }

            .corner-decor.bottom-left,
            .corner-decor.bottom-right {
                bottom: 40px;
            }
        }
    </style>
</head>
<body>
    <canvas id="intro-canvas"></canvas>
    
    <div class="intro-overlay">
        <div class="onz-container">
            <div class="onz-text">
                <span data-text="O" class="glitch-layer-1">O</span>
                <span data-text="N" class="glitch-layer-2">N</span>
                <span data-text="Z" class="glitch-layer-1">Z</span>
            </div>
            <div class="onz-underline"></div>
        </div>
        <p class="tagline">One New Zone</p>
    </div>

    <div class="enter-btn">
        <button onclick="enterMain()">ENTER</button>
    </div>

    <div class="progress-bar">
        <div class="progress"></div>
    </div>
    <div class="loading-text">LOADING...</div>

    <div class="scanline"></div>
    <div class="noise"></div>

    <div class="corner-decor top-left"></div>
    <div class="corner-decor top-right"></div>
    <div class="corner-decor bottom-left"></div>
    <div class="corner-decor bottom-right"></div>

    <!-- 过渡动画层 -->
    <div class="transition-overlay" id="transitionOverlay">
        <div class="transition-particles">
            <div class="transition-particle" style="left: 10%; top: 20%; animation-delay: 0s;"></div>
            <div class="transition-particle" style="left: 30%; top: 60%; animation-delay: 0.3s;"></div>
            <div class="transition-particle" style="left: 50%; top: 30%; animation-delay: 0.6s;"></div>
            <div class="transition-particle" style="left: 70%; top: 70%; animation-delay: 0.9s;"></div>
            <div class="transition-particle" style="left: 90%; top: 40%; animation-delay: 1.2s;"></div>
        </div>
        <div class="transition-text">ONZ</div>
    </div>

    <div class="scanline-effect" id="scanlineEffect"></div>

    <script>
        const canvas = document.getElementById('intro-canvas');
        const ctx = canvas.getContext('2d');
        const progressBar = document.querySelector('.progress');
        const progressContainer = document.querySelector('.progress-bar');
        const loadingText = document.querySelector('.loading-text');
        const enterBtn = document.querySelector('.enter-btn');

        let width, height;
        let particles = [];
        let animationComplete = false;
        let progress = 0;

        const colors = {
            cyan: '#00f5ff',
            orange: '#ff4500',
            purple: '#9d00ff',
            green: '#00ff88',
            black: '#0a0a0f'
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, type = 'explosion') {
                this.x = x;
                this.y = y;
                this.type = type;
                
                if (type === 'explosion') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 15 + 5;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.size = Math.random() * 4 + 2;
                    this.color = Object.values(colors)[Math.floor(Math.random() * 4)];
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.01;
                } else if (type === 'grid') {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2 + 1;
                    this.color = colors.cyan;
                    this.alpha = Math.random();
                    this.speed = Math.random() * 2 + 1;
                    this.direction = Math.random() > 0.5 ? 1 : -1;
                }
            }

            update() {
                if (this.type === 'explosion') {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                    this.life -= this.decay;
                } else if (this.type === 'grid') {
                    this.y += this.speed * this.direction;
                    if (this.y > height) this.y = 0;
                    if (this.y < 0) this.y = height;
                    this.alpha = 0.3 + Math.sin(Date.now() * 0.005) * 0.2;
                }
            }

            draw() {
                if (this.type === 'explosion') {
                    ctx.save();
                    ctx.globalAlpha = this.life;
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else if (this.type === 'grid') {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    ctx.fillRect(this.x, this.y, this.size, this.size);
                    ctx.restore();
                }
            }
        }

        function createExplosion(x, y, count = 100) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, 'explosion'));
            }
        }

        function initGridParticles() {
            for (let i = 0; i < 50; i++) {
                particles.push(new Particle(0, 0, 'grid'));
            }
        }

        function drawGlitchLines() {
            const lineCount = Math.floor(Math.random() * 5) + 2;
            for (let i = 0; i < lineCount; i++) {
                if (Math.random() > 0.7) {
                    const y = Math.random() * height;
                    const lineHeight = Math.random() * 3 + 1;
                    const offset = (Math.random() - 0.5) * 20;
                    
                    ctx.save();
                    ctx.globalAlpha = Math.random() * 0.3;
                    ctx.fillStyle = Math.random() > 0.5 ? colors.cyan : colors.purple;
                    ctx.fillRect(offset, y, width, lineHeight);
                    ctx.restore();
                }
            }
        }

        function drawGrid() {
            ctx.save();
            ctx.strokeStyle = colors.cyan;
            ctx.globalAlpha = 0.1;
            ctx.lineWidth = 1;

            const gridSize = 50;
            const perspective = 0.001;
            const time = Date.now() * 0.001;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let y = 0; y < height; y += gridSize) {
                const offset = (Math.sin(y * perspective + time) * 20);
                ctx.beginPath();
                ctx.moveTo(0, y + offset);
                ctx.lineTo(width, y + offset);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawCentralOrb() {
            const time = Date.now() * 0.002;
            const centerX = width / 2;
            const centerY = height / 2;
            const baseRadius = Math.min(width, height) * 0.15;

            for (let i = 0; i < 3; i++) {
                const radius = baseRadius + Math.sin(time + i * 2) * 20;
                const alpha = 0.3 - i * 0.1;
                
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.strokeStyle = Object.values(colors)[i];
                ctx.globalAlpha = alpha;
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 5]);
                ctx.stroke();
                ctx.restore();
            }
        }

        function animate() {
            ctx.fillStyle = colors.black;
            ctx.fillRect(0, 0, width, height);

            drawGrid();
            drawCentralOrb();
            drawGlitchLines();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].type === 'explosion' && particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        function createIntroSequence() {
            const sequence = [
                { time: 0, action: () => {} },
                { time: 500, action: () => createExplosion(width * 0.3, height * 0.4, 50) },
                { time: 800, action: () => createExplosion(width * 0.7, height * 0.4, 50) },
                { time: 1100, action: () => createExplosion(width * 0.5, height * 0.5, 100) },
                { time: 1500, action: () => createExplosion(width * 0.5, height * 0.3, 80) },
                { time: 2000, action: () => createExplosion(width * 0.3, height * 0.6, 60) },
                { time: 2300, action: () => createExplosion(width * 0.7, height * 0.6, 60) },
                { time: 2800, action: () => createExplosion(width * 0.5, height * 0.5, 150) },
                { time: 3500, action: () => showEnterButton() }
            ];

            sequence.forEach((item, index) => {
                setTimeout(item.action, item.time);
            });

            let startTime = Date.now();
            const duration = 2800;
            
            function updateProgress() {
                const elapsed = Date.now() - startTime;
                progress = Math.min((elapsed / duration) * 100, 100);
                progressBar.style.width = progress + '%';
                
                if (progress < 100) {
                    requestAnimationFrame(updateProgress);
                } else {
                    setTimeout(() => {
                        progressContainer.classList.add('hidden');
                        loadingText.classList.add('hidden');
                    }, 300);
                }
            }
            
            updateProgress();
            initGridParticles();
            animate();
        }

        function showEnterButton() {
            animationComplete = true;
            enterBtn.classList.add('visible');
            
            const centerX = width / 2;
            const centerY = height / 2;
            createExplosion(centerX, centerY, 200);
            
            setTimeout(() => {
                createExplosion(width * 0.2, height * 0.3, 50);
                createExplosion(width * 0.8, height * 0.3, 50);
                createExplosion(width * 0.2, height * 0.7, 50);
                createExplosion(width * 0.8, height * 0.7, 50);
            }, 200);

            setTimeout(() => {
                createExplosion(width * 0.2, height * 0.3, 30);
                createExplosion(width * 0.8, height * 0.3, 30);
            }, 400);
        }

        window.enterMain = function() {
            const transitionOverlay = document.getElementById('transitionOverlay');
            const scanlineEffect = document.getElementById('scanlineEffect');
            
            const fetchPromise = fetch('onz-main.html').then(r => r.text());
            
            scanlineEffect.classList.add('active');
            
            setTimeout(() => {
                transitionOverlay.classList.add('active');
                
                const centerX = width / 2;
                const centerY = height / 2;
                for (let i = 0; i < 4; i++) {
                    setTimeout(() => {
                        createExplosion(centerX, centerY, 60);
                    }, i * 80);
                }
            }, 150);
            
            const minTransitionDelay = new Promise(resolve => setTimeout(resolve, 800));
            
            Promise.all([fetchPromise, minTransitionDelay])
                .then(([html]) => {
                    sessionStorage.setItem('onz_transition', '1');
                    history.pushState({}, '', 'onz-main.html');
                    document.open();
                    document.write(html);
                    document.close();
                })
                .catch(() => {
                    sessionStorage.setItem('onz_transition', '1');
                    window.location.href = 'onz-main.html';
                });
        };

        // 键盘快捷键
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 32 || e.keyCode === 13) {
                if (enterBtn.classList.contains('visible')) {
                    e.preventDefault();
                    enterMain();
                }
            }
        });

        window.addEventListener('load', () => {
            setTimeout(createIntroSequence, 500);
        });
    </script>
</body>
</html>
